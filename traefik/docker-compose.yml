secrets:
  ovh_endpoint:
    file: "/home/docker/compose/secrets/traefik/ovh_endpoint.secret"
  ovh_application_key:
    file: "/home/docker/compose/secrets/traefik/ovh_application_key.secret"
  ovh_application_secret:
    file: "/home/docker/compose/secrets/traefik/ovh_application_secret.secret"
  ovh_consumer_key:
    file: "/home/docker/compose/secrets/traefik/ovh_consumer_key.secret"

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    secrets:
      - "ovh_endpoint"
      - "ovh_application_key"
      - "ovh_application_secret"
      - "ovh_consumer_key"
    environment:
      - "OVH_ENDPOINT_FILE=/run/secrets/ovh_endpoint"
      - "OVH_APPLICATION_KEY_FILE=/run/secrets/ovh_application_key"
      - "OVH_APPLICATION_SECRET_FILE=/run/secrets/ovh_application_secret"
      - "OVH_CONSUMER_KEY_FILE=/run/secrets/ovh_consumer_key"
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/docker/compose/traefik/traefik.yml:/traefik.yml:ro
      - /home/docker/compose/traefik/acme.json:/acme.json
      - /home/docker/compose/traefik/custom:/custom:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: true
      traefik.http.routers.api.entrypoints: https
      traefik.http.routers.api.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.api.service: api@internal

  error-pages:
    image: ghcr.io/tarampampam/error-pages:3.8.1
    container_name: traefik-error-pages
    restart: unless-stopped
    volumes:
      - ./my-error-page.html:/opt/my-error-page.html:ro
    command:
      - serve
      - --add-template=/opt/my-error-page.html
      - --template-name=my-error-page
    environment:
      TEMPLATE_NAME: my-error-page
      SHOW_DETAILS: "true"
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.error-pages.rule: HostRegexp(`.+`)
      traefik.http.routers.error-pages.priority: "1"        # priorité très basse
      traefik.http.routers.error-pages.entrypoints: https
      traefik.http.services.error-pages-svc.loadbalancer.server.port: "8080"
  

networks:
  proxy:
    external: true
