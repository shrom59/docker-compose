services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: always
    networks:
      - proxy
    ports:
      - 53:53/udp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: true
      traefik.http.routers.adguard.entrypoints: https
      traefik.http.routers.adguard.rule: Host(`adguard.${DOMAIN}`)
      traefik.http.routers.adguard.service: adguard
      traefik.http.services.adguard.loadbalancer.server.port: 80

  adguardhome-metrics:
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    container_name: adguardhome-metrics
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - ADGUARD_SERVERS=${ADGUARD_SERVERS}
      - ADGUARD_USERNAMES=${ADGUARD_USERNAMES}
      - ADGUARD_PASSWORDS=${ADGUARD_PASSWORDS}

networks:
  proxy:
    external: true

volumes:
  work:
  conf:
